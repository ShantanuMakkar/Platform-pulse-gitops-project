apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-pulse
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ShantanuMakkar/Platform-pulse-gitops-project.git
    targetRevision: main
    path: charts/platform-pulse

  destination:
    server: https://kubernetes.default.svc
    namespace: platform-pulse

  syncPolicy:
    automated:
      prune: true     # remove resources that were deleted from git
      selfHeal: true   # revert any manual change back to what git says
    syncOptions:
      - CreateNamespace=true